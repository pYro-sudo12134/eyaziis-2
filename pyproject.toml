[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
    ".terraform",
    "build",
    "tmp",
    ".pytest_cache",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",
    "BLE001",
    "RUF001",
    "RUF002",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["B", "SIM"]