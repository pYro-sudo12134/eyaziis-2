{% extends "base.html" %}
{% block title %}Синтез речи{% endblock %}

{% block content %}
<h1>Синтез речи</h1>

<section class="card">
    <label for="text">Текст:</label>
    <textarea id="text" rows="5" placeholder="Введите текст или вставьте из буфера..."></textarea>

    <div class="row">
        <button type="button" id="paste-btn">📋 Вставить</button>
        <button type="button" id="selection-btn">🖱 Взять выделенное</button>
    </div>
</section>

<section class="card">
    <h2>Параметры</h2>
    <div class="grid">
        <label>Голос
            <select id="voice">
                <option value="ru_RU-irina-medium">Ирина (жен.)</option>
                <option value="ru_RU-dmitri-medium">Дмитрий (муж.)</option>
            </select>
        </label>
        <label>Формат
            <select id="format">
                <option value="mp3">MP3</option>
                <option value="wav">WAV</option>
                <option value="ogg">OGG</option>
            </select>
        </label>
        <label>Скорость: <span id="speed-val">1.0</span>
            <input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.0">
        </label>
        <label>Громкость: <span id="volume-val">1.0</span>
            <input type="range" id="volume" min="0.0" max="2.0" step="0.1" value="1.0">
        </label>
        <label>Тон: <span id="pitch-val">1.0</span>
            <input type="range" id="pitch" min="0.5" max="2.0" step="0.1" value="1.0">
        </label>
    </div>
</section>

<section class="card">
    <button type="button" id="submit-btn" class="primary">▶ Озвучить</button>
    <div id="status" class="status"></div>
</section>

<section class="card" id="result-card" hidden>
    <h2>Результат</h2>
    <audio id="player" controls></audio>
    <div class="row">
        <a id="download-link" download>⬇ Скачать</a>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/synthesize.js"></script>
{% endblock %}
