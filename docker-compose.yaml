version: "3.9"

networks:
  app-network:
    driver: bridge
    name: app-network

volumes:
  localstack-data:
  ollama-data:
  qdrant-data:
  tts-voices:
  redis-data:

services:
  localstack:
    build:
      context: ./localstack
      dockerfile: Dockerfile
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,lambda,stepfunctions,iam,apigateway,transcribe,dynamodb,ssm,secretsmanager,logs,events
      - DEBUG=1
      - PERSISTENCE=1
      - LAMBDA_DOCKER_NETWORK=app-network
      - LAMBDA_KEEPALIVE_MS=60000
      - SQS_ENDPOINT_STRATEGY=domain
      - OLLAMA_URL=http://ollama1:11435
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack-data:/var/lib/localstack
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama1:
    image: ollama/ollama:latest
    container_name: ollama1
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  tts-service:
    build:
      context: ./tts-service
      dockerfile: Dockerfile
    container_name: tts-service
    ports:
      - "8001:8000"
    volumes:
      - tts-voices:/app/voices
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL_SECONDS=3600
      - RATE_LIMIT_REQUESTS=10
      - RATE_LIMIT_WINDOW=60
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: web-client
    ports:
      - "8092:8000"
    environment:
      - API_GATEWAY_URL=http://localstack:4566
      - API_STAGE=dev
      - API_ID=${API_ID}
      - TTS_SERVICE_URL=http://tts-service:8000
    networks:
      - app-network
    restart: unless-stopped