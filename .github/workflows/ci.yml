name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-tests:
    name: Python tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [tts-service, web-client]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.service }}/requirements.txt
            ${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Ruff check
        run: ruff check tts-service web-client lambda shared

      - name: Ruff format check
        run: ruff format --check tts-service web-client lambda shared

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (dev)
        working-directory: terraform/environments/dev
        run: terraform init -backend=false

      - name: Terraform validate (dev)
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        working-directory: terraform
        run: |
          tflint --init --config=${{ github.workspace }}/.tflint.hcl
          tflint --config=${{ github.workspace }}/.tflint.hcl --chdir=environments/dev
          tflint --config=${{ github.workspace }}/.tflint.hcl --chdir=modules/apigateway
          tflint --config=${{ github.workspace }}/.tflint.hcl --chdir=modules/dynamodb
          tflint --config=${{ github.workspace }}/.tflint.hcl --chdir=modules/iam
          tflint --config=${{ github.workspace }}/.tflint.hcl --chdir=modules/lambda
          tflint --config=${{ github.workspace }}/.tflint.hcl --chdir=modules/s3
          tflint --config=${{ github.workspace }}/.tflint.hcl --chdir=modules/secretsmanager
          tflint --config=${{ github.workspace }}/.tflint.hcl --chdir=modules/sqs
          tflint --config=${{ github.workspace }}/.tflint.hcl --chdir=modules/ssm
          tflint --config=${{ github.workspace }}/.tflint.hcl --chdir=modules/stepfunctions